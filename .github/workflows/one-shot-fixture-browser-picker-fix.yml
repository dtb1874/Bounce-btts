name: One-shot fixture browser picker fix

on:
  push:
    branches: [fix/fixture-browser-follows-gameweek]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[fixture-picker-patch]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fixture-browser-follows-gameweek
          fetch-depth: 0
      - name: Apply targeted hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          league = Path('app/LeagueApp.tsx')
          source = league.read_text()
          old = '''  const [fixturesRequested,setFixturesRequested] = useState(false);\n  const [fixturesLoading,setFixturesLoading] = useState(false);\n  const [fixturesLoadError,setFixturesLoadError] = useState("");\n  useEffect(()=>{\n    if(view!=="fixtures"||fixturesRequested)return;'''
          new = '''  const [fixturesRequested,setFixturesRequested] = useState(false);\n  const [fixturesLoading,setFixturesLoading] = useState(false);\n  const [fixturesLoadError,setFixturesLoadError] = useState("");\n  useEffect(()=>{setFixturesRequested(false);},[gameweekId]);\n  useEffect(()=>{\n    if(view!=="fixtures"||fixturesRequested)return;'''
          if old not in source:
              raise SystemExit('LeagueApp fixture browser state anchor not found')
          source = source.replace(old, new, 1)
          old_fetch = 'const response=await fetch("/api/fixture-browser",{headers:{authorization:`Bearer ${await token()}`}});'
          new_fetch = 'const response=await fetch(`/api/fixture-browser?gameweekId=${encodeURIComponent(gameweekId)}`,{headers:{authorization:`Bearer ${await token()}`}});'
          if old_fetch not in source:
              raise SystemExit('LeagueApp fixture browser fetch anchor not found')
          source = source.replace(old_fetch, new_fetch, 1)
          league.write_text(source)

          route = Path('app/api/fixture-browser/route.ts')
          route.write_text('''import { NextResponse } from "next/server";\nimport { createAdminClient } from "@/lib/supabase/admin";\nimport { fixtureDateForGameweek } from "@/lib/gameweek-rules";\n\nexport async function GET(request: Request) {\n  const authorization = request.headers.get("authorization") ?? "";\n  const accessToken = authorization.startsWith("Bearer ") ? authorization.slice(7) : "";\n  if (!accessToken) return NextResponse.json({ error: "Unauthorized" }, { status: 401 });\n\n  const admin = createAdminClient();\n  const { data: { user }, error: authError } = await admin.auth.getUser(accessToken);\n  if (authError || !user) return NextResponse.json({ error: "Unauthorized" }, { status: 401 });\n\n  const { data: profile } = await admin\n    .from("profiles")\n    .select("id,approved,active")\n    .eq("id", user.id)\n    .maybeSingle();\n  if (!profile?.approved || !profile.active) return NextResponse.json({ error: "Forbidden" }, { status: 403 });\n\n  const url = new URL(request.url);\n  const gameweekId = url.searchParams.get("gameweekId");\n  let anchorDate = new Date();\n\n  if (gameweekId) {\n    const { data: gameweek, error: gameweekError } = await admin\n      .from("gameweeks")\n      .select("locks_at,selection_rule_mode,selection_weekday,selection_time,selection_times,selection_time_from,selection_time_to,one_off_rule")\n      .eq("id", gameweekId)\n      .maybeSingle();\n    if (gameweekError) return NextResponse.json({ error: "Unable to load gameweek" }, { status: 500 });\n    if (!gameweek) return NextResponse.json({ error: "Gameweek not found" }, { status: 404 });\n    const fixtureDate = fixtureDateForGameweek(gameweek);\n    anchorDate = new Date(`${fixtureDate}T12:00:00Z`);\n  }\n\n  const weekStart = new Date(Date.UTC(anchorDate.getUTCFullYear(), anchorDate.getUTCMonth(), anchorDate.getUTCDate()));\n  const mondayOffset = (weekStart.getUTCDay() + 6) % 7;\n  weekStart.setUTCDate(weekStart.getUTCDate() - mondayOffset);\n  const followingWeekEnd = new Date(weekStart);\n  followingWeekEnd.setUTCDate(followingWeekEnd.getUTCDate() + 14);\n\n  const { data: fixtures, error } = await admin\n    .from("fixtures")\n    .select("*")\n    .gte("kickoff_at", weekStart.toISOString())\n    .lt("kickoff_at", followingWeekEnd.toISOString())\n    .order("kickoff_at")\n    .order("competition")\n    .order("home_team");\n\n  if (error) return NextResponse.json({ error: "Unable to load fixtures" }, { status: 500 });\n  return NextResponse.json({ fixtures: fixtures ?? [] });\n}\n''')

          history = Path('scripts/apply-reminder-history.mjs')
          text = history.read_text()
          text = text.replace('// v1.13.1 sync: retain the UI Foundation release while adding fixture preload and gameweek-schedule resilience.', '// v1.13.2 sync: keep fixture browsing aligned with the selected gameweek calendar window.')
          marker = '  const catchup=[\\n    {version:"1.13.1"'
          insert = '  const catchup=[\\n    {version:"1.13.2",date:"10 Sep 2026",summary:"Fixture browser follows selected gameweek",changes:["Made the two-week Fixtures view follow the global gameweek picker instead of staying pinned to the current calendar fortnight","Anchored the browser window to the selected gameweek’s canonical fixture date so future and historical gameweeks show the correct two-week catalogue","Reloaded fixture-browser data whenever the selected gameweek changes while preserving existing search, country and competition browsing"]},\\n    {version:"1.13.1"'
          if marker not in text:
              raise SystemExit('Release history entry anchor not found')
          text = text.replace(marker, insert, 1)
          text = text.replace("source.replace(oldReleaseVersion, 'const RELEASE_VERSION = \\\"1.13.1\\\";')", "source.replace(oldReleaseVersion, 'const RELEASE_VERSION = \\\"1.13.2\\\";')")
          text = text.replace("source.replace('const RELEASE_VERSION = \\\"1.13.0\\\";', 'const RELEASE_VERSION = \\\"1.13.1\\\";')", "source.replace('const RELEASE_VERSION = \\\"1.13.1\\\";', 'const RELEASE_VERSION = \\\"1.13.2\\\";')\\nelse if (source.includes('const RELEASE_VERSION = \\\"1.13.0\\\";')) source = source.replace('const RELEASE_VERSION = \\\"1.13.0\\\";', 'const RELEASE_VERSION = \\\"1.13.2\\\";')")
          text = text.replace("source.replace('const RELEASE_VERSION = \\\"1.12.1\\\";', 'const RELEASE_VERSION = \\\"1.13.1\\\";')", "source.replace('const RELEASE_VERSION = \\\"1.12.1\\\";', 'const RELEASE_VERSION = \\\"1.13.2\\\";')")
          text = text.replace("source.replace('const RELEASE_VERSION = \\\"1.12.0\\\";', 'const RELEASE_VERSION = \\\"1.13.1\\\";')", "source.replace('const RELEASE_VERSION = \\\"1.12.0\\\";', 'const RELEASE_VERSION = \\\"1.13.2\\\";')")
          text = text.replace("!source.includes('const RELEASE_VERSION = \\\"1.13.1\\\";')", "!source.includes('const RELEASE_VERSION = \\\"1.13.2\\\";')")
          history.write_text(text)
          PY
      - name: Commit hotfix
        run: |
          git config user.name "dtb1874"
          git config user.email "dtb1874@gmail.com"
          git add app/LeagueApp.tsx app/api/fixture-browser/route.ts scripts/apply-reminder-history.mjs
          git commit -m "Fix fixture browser gameweek navigation"
          git push origin HEAD:fix/fixture-browser-follows-gameweek
