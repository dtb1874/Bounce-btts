name: Apply v2 mobile polish
on:
  push:
    branches: [feature/v2.0]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/v2_mobile_polish.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/LeagueApp.tsx app/login/page.tsx app/release.module.css
          git commit -m 'Polish v2 timeline, stats and heritage visuals'
          git push
