name: Build Bounce BTTS v2 preview

on:
  push:
    branches:
      - feature/v2.0

permissions:
  contents: write

jobs:
  build-v2-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v2.0 source changes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/LeagueApp.tsx')
          s=p.read_text()
          s=s.replace('const RELEASE_VERSION = "1.4.9.11";', 'const RELEASE_VERSION = "2.0.0";', 1)
          s=s.replace('const RELEASE_DATE = "16 Aug 2026";', 'const RELEASE_DATE = "16 Aug 2026";', 1)
          old='{view==="table" && <LeagueTable standings={standings} seasonLabel={seasonLabel} gameweek={gameweek??null} entryFee={entryFee} fixtures={fixtures} predictions={predictions}/>}'
          new='{view==="table" && <LeagueTable standings={standings} seasonLabel={seasonLabel} gameweek={gameweek??null} entryFee={entryFee} fixtures={fixtures} predictions={predictions} profiles={profiles} gameweeks={initialGameweeks} adjustments={adjustments}/>}'
          if old not in s: raise SystemExit('LeagueTable invocation not found')
          s=s.replace(old,new,1)
          marker='function LeagueTable({standings,seasonLabel,gameweek,entryFee,fixtures,predictions}:{standings:Standing[];seasonLabel:string;gameweek:Gameweek|null;entryFee:number;fixtures:Fixture[];predictions:Prediction[]}){'
          replacement='''function SeasonPositionTimeline({profiles,gameweeks,predictions,adjustments}:{profiles:Profile[];gameweeks:Gameweek[];predictions:Prediction[];adjustments:ScoreAdjustment[]}){
  const activeWeeks=useMemo(()=>[...gameweeks].filter(g=>predictions.some(p=>p.gameweek_id===g.id&&p.points_awarded!=null)||adjustments.some(a=>a.gameweek_id===g.id)).sort((a,b)=>a.number-b.number),[gameweeks,predictions,adjustments]);
  const timeline=useMemo(()=>activeWeeks.map((gw,weekIndex)=>{
    const included=new Set(activeWeeks.slice(0,weekIndex+1).map(g=>g.id));
    const rows=profiles.map(profile=>{
      let points=0,wins=0,zeroZeroCount=0;
      for(const pred of predictions){if(pred.member_id!==profile.id||!included.has(pred.gameweek_id)||pred.points_awarded==null)continue;points+=pred.points_awarded;if(pred.points_awarded===3)wins+=1;if(pred.points_awarded===-1)zeroZeroCount+=1;}
      for(const adj of adjustments){if(adj.member_id!==profile.id||!included.has(adj.gameweek_id))continue;const scored=predictions.some(p=>p.member_id===adj.member_id&&p.gameweek_id===adj.gameweek_id&&p.points_awarded!=null);if(adj.reason.trim().toLowerCase()==="missed selection"&&scored)continue;points+=adj.points;}
      return {id:profile.id,name:profile.display_name,points,wins,zeroZeroCount};
    }).sort((a,b)=>b.points-a.points||a.zeroZeroCount-b.zeroZeroCount||b.wins-a.wins||a.name.localeCompare(b.name));
    return {number:gw.number,rows:rows.map((row,index)=>({...row,position:index+1}))};
  }),[activeWeeks,profiles,predictions,adjustments]);
  const [step,setStep]=useState(0);
  const [playing,setPlaying]=useState(true);
  const [focus,setFocus]=useState<string|null>(null);
  useEffect(()=>{setStep(0);setPlaying(timeline.length>1)},[timeline.length]);
  useEffect(()=>{if(!playing||step>=timeline.length-1)return;const t=window.setTimeout(()=>setStep(v=>Math.min(v+1,timeline.length-1)),900);return()=>window.clearTimeout(t)},[playing,step,timeline.length]);
  useEffect(()=>{if(step>=timeline.length-1)setPlaying(false)},[step,timeline.length]);
  if(!timeline.length)return <div className={styles.seasonTimeline}><div className={styles.timelineHeading}><div><span>SEASON POSITION TIMELINE</span><h3>The race through the season</h3></div></div><div className={styles.timelineEmpty}>Position history will appear as soon as the first gameweek is scored.</div></div>;
  const width=920,height=Math.max(350,profiles.length*48+90),left=48,right=150,top=34,bottom=48,plotW=width-left-right,plotH=height-top-bottom;
  const x=(i:number)=>left+(timeline.length===1?0:(i*plotW)/(timeline.length-1));
  const y=(pos:number)=>top+(profiles.length<=1?0:((pos-1)*plotH)/(profiles.length-1));
  const colours=['#f6cf79','#f08ba2','#8ed0ff','#9be29b','#c3a0ff','#ffb36b','#7fe0d0','#e9e9e9','#d2a679','#ff8fcf','#8fb3ff','#b7e36f'];
  const shown=timeline.slice(0,step+1);
  const current=timeline[step];
  return <div className={styles.seasonTimeline}>
    <div className={styles.timelineHeading}><div><span>SEASON POSITION TIMELINE</span><h3>The race through the season</h3><p>Animated gameweek-by-gameweek using the same league-table tie-break rules.</p></div><div className={styles.timelineNow}><span>VIEWING</span><strong>GW {current.number}</strong></div></div>
    <div className={styles.timelineControls}><button onClick={()=>setPlaying(v=>!v)} disabled={timeline.length<2}>{playing?'Pause':'Play'}</button><button onClick={()=>{setStep(0);setPlaying(timeline.length>1)}}>Restart</button><input aria-label="Timeline gameweek" type="range" min={0} max={timeline.length-1} value={step} onChange={e=>{setStep(Number(e.target.value));setPlaying(false)}}/><span>GW {current.number}</span></div>
    <div className={styles.timelineChartWrap}><svg className={styles.timelineChart} viewBox={`0 0 ${width} ${height}`} role="img" aria-label={`League positions through gameweek ${current.number}`}>
      {profiles.map((_,i)=><g key={`grid-${i}`}><line x1={left} x2={width-right+8} y1={y(i+1)} y2={y(i+1)} className={styles.timelineGrid}/><text x={left-14} y={y(i+1)+5} textAnchor="end" className={styles.timelinePositionLabel}>{i+1}</text></g>)}
      {shown.map((week,i)=><g key={`gw-${week.number}`}><line x1={x(i)} x2={x(i)} y1={top} y2={height-bottom} className={styles.timelineVertical}/><text x={x(i)} y={height-15} textAnchor="middle" className={styles.timelineGwLabel}>GW {week.number}</text></g>)}
      {profiles.map((profile,playerIndex)=>{const points=shown.map((week,i)=>{const row=week.rows.find(r=>r.id===profile.id);return `${x(i)},${y(row?.position??profiles.length)}`}).join(' ');const currentRow=current.rows.find(r=>r.id===profile.id);const dim=focus&&focus!==profile.id;const colour=colours[playerIndex%colours.length];return <g key={profile.id} className={dim?styles.timelineDim:styles.timelineSeries} onClick={()=>setFocus(v=>v===profile.id?null:profile.id)} style={{cursor:'pointer'}}><polyline points={points} fill="none" stroke={colour} strokeWidth={focus===profile.id?6:4} strokeLinejoin="round" strokeLinecap="round"/><circle cx={x(step)} cy={y(currentRow?.position??profiles.length)} r={focus===profile.id?7:5} fill={colour}/><text x={x(step)+12} y={y(currentRow?.position??profiles.length)+4} className={styles.timelinePlayerLabel} fill={colour}>{profile.display_name}</text></g>})}
    </svg></div>
    <div className={styles.timelineFooter}><span>1st is always at the top</span><strong>{focus?'Tap the highlighted player again to show everyone':'Tap a player line or name to highlight them'}</strong></div>
  </div>
}

function LeagueTable({standings,seasonLabel,gameweek,entryFee,fixtures,predictions,profiles,gameweeks,adjustments}:{standings:Standing[];seasonLabel:string;gameweek:Gameweek|null;entryFee:number;fixtures:Fixture[];predictions:Prediction[];profiles:Profile[];gameweeks:Gameweek[];adjustments:ScoreAdjustment[]}){'''
          if marker not in s: raise SystemExit('LeagueTable signature not found')
          s=s.replace(marker,replacement,1)
          table_end='''</div><div className={styles.leagueStatsBand}>'''
          insert='''</div><SeasonPositionTimeline profiles={profiles} gameweeks={gameweeks} predictions={predictions} adjustments={adjustments}/><div className={styles.leagueStatsBand}>'''
          if table_end not in s: raise SystemExit('League table insertion point not found')
          s=s.replace(table_end,insert,1)
          release='''  const releases=[\n    {version:"1.4.9.11"'''
          release_new='''  const releases=[\n    {version:"2.0.0",date:"16 Aug 2026",summary:"Season Position Timeline and v2 league-table experience",changes:["Added an animated Season Position Timeline beneath the main League Table, advancing gameweek by gameweek through the season","Historical positions use the same standings rules as the live league: points, fewest 0-0 results, most BTTS wins, then alphabetical order","Added Play, Pause, Restart and a gameweek scrubber so the season race can be replayed or inspected manually","Players can be tapped to highlight their line while fading the rest, with current-position labels moving through the animation","The chart is fully responsive and designed to fit the mobile card width without horizontal scrolling","Refreshed the League Table presentation with subtle Heart of Midlothian pavement-mosaic texture while retaining the maroon and gold Bounce identity","All existing scoring, selections, live results, sharing, admin controls and mobile Dashboard functionality are preserved"]},\n    {version:"1.4.9.11"'''
          if release not in s: raise SystemExit('Release history insertion point not found')
          s=s.replace(release,release_new,1)
          p.write_text(s)

          css=Path('app/release.module.css')
          c=css.read_text()
          c+='''\n\n/* v2.0 Season Position Timeline */\n.leaguePage{position:relative;isolation:isolate}.leaguePage:before{content:"";position:absolute;inset:70px 0 auto auto;width:360px;height:360px;background:url('/assets/st-giles-heart.jpg') center/cover no-repeat;opacity:.035;filter:sepia(1) saturate(.7);pointer-events:none;z-index:-1;border-radius:50%}.seasonTimeline{position:relative;overflow:hidden;margin:18px 0;padding:18px;border:1px solid rgba(232,190,95,.36);border-radius:18px;background:linear-gradient(145deg,rgba(66,12,29,.98),rgba(31,8,17,.98));box-shadow:0 18px 42px rgba(0,0,0,.25)}.seasonTimeline:after{content:"";position:absolute;right:-70px;top:-95px;width:250px;height:250px;background:url('/assets/st-giles-heart.jpg') center/cover no-repeat;opacity:.045;transform:rotate(14deg);pointer-events:none}.timelineHeading{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.timelineHeading span,.timelineNow span{font-size:10px;letter-spacing:.16em;color:#e8be5f;font-weight:800}.timelineHeading h3{margin:3px 0 2px;font-size:22px;color:#fff}.timelineHeading p{margin:0;color:rgba(255,255,255,.64);font-size:12px}.timelineNow{min-width:80px;text-align:right}.timelineNow strong{display:block;color:#f6cf79;font-size:22px}.timelineControls{position:relative;z-index:1;display:grid;grid-template-columns:auto auto minmax(110px,1fr) auto;gap:8px;align-items:center;margin:14px 0 8px}.timelineControls button{border:1px solid rgba(246,207,121,.5);background:rgba(246,207,121,.08);color:#f6cf79;border-radius:9px;padding:7px 11px;font-weight:800}.timelineControls input{width:100%;accent-color:#e8be5f}.timelineControls span{font-size:11px;color:#f6cf79;font-weight:800}.timelineChartWrap{position:relative;z-index:1;width:100%;overflow:hidden;border-radius:12px;background:rgba(0,0,0,.12)}.timelineChart{display:block;width:100%;height:auto;min-height:330px}.timelineGrid{stroke:rgba(255,255,255,.095);stroke-width:1}.timelineVertical{stroke:rgba(232,190,95,.08);stroke-width:1}.timelinePositionLabel,.timelineGwLabel{fill:rgba(255,255,255,.48);font-size:12px;font-weight:700}.timelinePlayerLabel{font-size:12px;font-weight:900;paint-order:stroke;stroke:rgba(32,6,14,.9);stroke-width:3px;stroke-linejoin:round}.timelineSeries{opacity:1;transition:opacity .2s}.timelineDim{opacity:.16;transition:opacity .2s}.timelineFooter{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:rgba(255,255,255,.5);font-size:10px}.timelineFooter strong{color:rgba(246,207,121,.8);text-align:right}.timelineEmpty{padding:28px 10px 12px;color:rgba(255,255,255,.6);text-align:center}.leagueTableFirst{box-shadow:0 16px 42px rgba(0,0,0,.2)}\n@media(max-width:650px){.leaguePage:before{width:220px;height:220px;opacity:.025}.seasonTimeline{margin:12px 0;padding:12px 8px;border-radius:14px}.timelineHeading{padding:0 4px}.timelineHeading h3{font-size:18px}.timelineHeading p{font-size:10px;max-width:220px}.timelineNow strong{font-size:18px}.timelineControls{grid-template-columns:auto auto 1fr auto;gap:5px;margin:10px 2px 5px}.timelineControls button{padding:6px 8px;font-size:10px}.timelineControls span{font-size:9px}.timelineChart{min-height:300px}.timelinePlayerLabel{font-size:11px}.timelinePositionLabel,.timelineGwLabel{font-size:11px}.timelineFooter{padding:0 4px;display:block}.timelineFooter strong{display:block;text-align:left;margin-top:3px}.enhancedTableShell{overflow:hidden}.fullLeagueTable .tableRow{grid-template-columns:38px minmax(92px,1fr) repeat(5,38px)!important;gap:1px;font-size:10px;padding-left:4px;padding-right:4px}.fullLeagueTable .tableRow>span,.fullLeagueTable .tableRow>strong,.fullLeagueTable .tableRow>b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}\n'''
          css.write_text(c)
          PY
      - name: Commit v2 preview source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/LeagueApp.tsx app/release.module.css
          git commit -m 'Build v2.0 season position timeline preview'
          git push
