name: Build Bounce BTTS v2 preview

on:
  push:
    branches:
      - feature/v2.0

permissions:
  contents: write

jobs:
  build-v2-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v2 source changes
        run: python scripts/build_v2_preview.py
      - name: Commit v2 preview source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/LeagueApp.tsx app/release.module.css
          git commit -m 'Build v2.0 season position timeline preview'
          git push
