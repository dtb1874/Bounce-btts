name: Apply visible v2 heritage imagery
on:
  push:
    branches: [feature/v2.0]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/v2_visible_heritage.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/release.module.css
          git commit -m 'Strengthen v2 Edinburgh and mosaic imagery'
          git push
