name: Build v1.4.7 release

on:
  push:
    branches:
      - release/v1.4.7

permissions:
  contents: write

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v1.4.7 changes
        run: python release-v1.4.7/apply_release.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build compatibility check
        run: npm run build

      - name: Create upload package
        run: |
          rm -rf release-v1.4.7/package
          mkdir -p release-v1.4.7/package/app
          cp app/LeagueApp.tsx release-v1.4.7/package/app/LeagueApp.tsx
          cp app/release.module.css release-v1.4.7/package/app/release.module.css
          cp README_BOUNCE_BTTS_v1.4.7.txt release-v1.4.7/package/README_BOUNCE_BTTS_v1.4.7.txt
          cd release-v1.4.7/package
          zip -r ../Bounce-BTTS-v1.4.7.zip .

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: Bounce-BTTS-v1.4.7
          path: release-v1.4.7/Bounce-BTTS-v1.4.7.zip

      - name: Commit verified release source to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/LeagueApp.tsx app/release.module.css README_BOUNCE_BTTS_v1.4.7.txt release-v1.4.7/Bounce-BTTS-v1.4.7.zip
          git commit -m "Build Bounce BTTS v1.4.7" || exit 0
          git push
