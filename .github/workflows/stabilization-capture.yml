name: Stabilisation source normalise

on:
  push:
    branches:
      - stabilize/canonical-v1.6-foundation

permissions:
  contents: write

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  normalise:
    if: ${{ !contains(github.event.head_commit.message, '[canonical-source]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Normalise canonical source
        run: python scripts/normalize-canonical-source.py

      - name: Validate canonical build
        run: npm run build

      - name: Commit canonical source changes
        shell: bash
        run: |
          git add app/LeagueApp.tsx
          if git diff --cached --quiet; then
            echo "Canonical source already normalised."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Normalize canonical application source [canonical-source]"
          git push origin HEAD:stabilize/canonical-v1.6-foundation
