name: Stabilisation source bake

on:
  push:
    branches:
      - stabilize/canonical-v1.6-foundation

permissions:
  contents: write

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  bake:
    if: ${{ !contains(github.event.head_commit.message, '[bake-generated-source]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Apply current production patch chain and validate
        run: npm run build

      - name: Bake generated tracked source into this branch
        shell: bash
        run: |
          rm -rf public/_stabilization-source
          git add -u
          if git diff --cached --quiet; then
            echo "No build-time source drift remains."
            exit 0
          fi
          echo "Build-time files being baked:"
          git diff --cached --name-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bake generated v1.6.3 source [bake-generated-source]"
          git push origin HEAD:stabilize/canonical-v1.6-foundation
