name: Pre-v2 cleanup finalizer

on:
  push:
    branches:
      - maintenance/pre-v2-cleanup

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add maintenance release note and remove exact duplicates
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/LeagueApp.tsx')
          s=p.read_text()
          s=s.replace('const RELEASE_VERSION = "1.4.9.10";', 'const RELEASE_VERSION = "1.4.9.11";', 1)
          s=s.replace('const RELEASE_DATE = "15 Aug 2026";', 'const RELEASE_DATE = "16 Aug 2026";', 1)
          needle='  const releases=[\n    {version:"1.4.9.10"'
          replacement='  const releases=[\n    {version:"1.4.9.11",date:"16 Aug 2026",summary:"Pre-v2 repository and build cleanup",changes:["Baked the complete v1.4.9.10 application state into the real source files so releases no longer depend on historical patch scripts at build time","Simplified the production build back to the standard Next.js build command","Removed obsolete v1.4.x release patch folders and legacy build workflows from the active codebase while retaining their full history in Git","Removed only byte-for-byte duplicate root files where a canonical copy already exists in app, lib, public or supabase","No league behaviour, scoring rules, live results, selections or user-facing functionality was intentionally changed"]},\n    {version:"1.4.9.10"'
          if needle not in s:
              raise SystemExit('Could not locate v1.4.9.10 release entry')
          s=s.replace(needle,replacement,1)
          p.write_text(s)
          PY
          rm -f admin.ts auth.ts client.ts deadline.ts missed-picks.ts password-vault.ts server-auth.ts server.ts
          rm -f edinburgh-skyline.jpg hearts-crest.png manifest.webmanifest st-giles-footer.jpg st-giles-heart.jpg st-giles-round.jpg
          rm -f schema.sql 20260807_add_provider_imports_and_admin_alerts.sql 20260807_expand_users_and_preserve_history.sql
      - name: Commit cleanup finalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize pre-v2 cleanup and add v1.4.9.11 maintenance notes'
          git push
