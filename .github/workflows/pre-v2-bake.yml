name: Pre-v2 source bake

on:
  push:
    branches:
      - maintenance/pre-v2-cleanup

permissions:
  contents: write

jobs:
  bake-current-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Bake current v1.4.9.10 source
        run: |
          python release-v1.4.7.2/apply_release.py
          python release-v1.4.7.3/fix_css.py
          python release-v1.4.7.4/apply_patch.py
          python release-v1.4.7.6/apply_patch.py
          python release-v1.4.7.7/apply_patch.py
          python release-v1.4.7.8/apply_patch.py
          python release-v1.4.7.9/apply_patch.py
          python release-v1.4.8/apply_patch.py
          python release-v1.4.8.1/apply_patch.py
          python release-v1.4.8.2/apply_patch.py
          python release-v1.4.8.3/apply_patch.py
          python release-v1.4.8.4/apply_patch.py
          python release-v1.4.9/apply_patch.py
          python release-v1.4.9.1/apply_patch.py
          python release-v1.4.9.2/apply_patch.py
          python release-v1.4.9.3/apply_patch.py
          python release-v1.4.9.4/apply_patch.py
          python release-v1.4.9.5/apply_patch.py
          python release-v1.4.9.6/apply_patch.py
          python release-v1.4.9.7/apply_patch.py
          python release-v1.4.9.8/apply_patch.py
          python release-v1.4.9.9/apply_patch.py
          python release-v1.4.9.10/apply_patch.py
      - name: Simplify build and remove obsolete release scaffolding
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json')
          data=json.loads(p.read_text())
          data['scripts']['build']='next build'
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
          rm -rf release-v1.4.6 release-v1.4.7 release-v1.4.7.2 release-v1.4.7.3 release-v1.4.7.4 release-v1.4.7.6 release-v1.4.7.7 release-v1.4.7.8 release-v1.4.7.9
          rm -rf release-v1.4.8 release-v1.4.8.1 release-v1.4.8.2 release-v1.4.8.3 release-v1.4.8.4
          rm -rf release-v1.4.9 release-v1.4.9.1 release-v1.4.9.2 release-v1.4.9.3 release-v1.4.9.4 release-v1.4.9.5 release-v1.4.9.6 release-v1.4.9.7 release-v1.4.9.8 release-v1.4.9.9 release-v1.4.9.10
          rm -f .github/workflows/build-v1.4.6.yml .github/workflows/build-v1.4.7.yml
      - name: Commit baked source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Bake v1.4.9.10 source and remove legacy patch chain'
          git push
