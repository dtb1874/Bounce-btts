name: Release guardrails

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Prevent obsolete patch architecture
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "release-v1\.4\.9\.2\|python .*release-" package.json; then
            echo "Obsolete build-time patch chain detected in package.json"
            exit 1
          fi

          forbidden=(LeagueApp.tsx PublicLeagueTable.tsx ShareTableButton.tsx api-football.ts public-table.ts scoring.ts fractional.ts globals.css layout.tsx)
          for path in "${forbidden[@]}"; do
            if [ -e "$path" ]; then
              echo "Duplicate root source file detected: $path"
              exit 1
            fi
          done

          if find . -maxdepth 1 -type d -name 'release-*' | grep -q .; then
            echo "Historical release patch directory detected at repository root"
            exit 1
          fi

      - name: Block unsafe release DOM mutation
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'footer\.textContent\s*=|new MutationObserver\(' app lib 2>/dev/null | grep -E 'ReleaseInfo|release-info|footer\.textContent'; then
            echo "Unsafe release-info DOM mutation pattern detected."
            exit 1
          fi
          if grep -q 'MobileSidebarPortrait\|Release4HistoryPrestige' app/layout.tsx; then
            echo "A retired UI DOM bridge is mounted in RootLayout."
            exit 1
          fi

      - name: UI foundation experience source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-ui-foundation-shell="declarative"' app/ui/AuthenticatedShellFrame.tsx
          for hook in uiFoundationShell uiFoundationSidebar uiFoundationSidebarOpen uiFoundationMobileMenu uiFoundationScrim uiFoundationMain; do
            grep -q "$hook" app/ui/AuthenticatedShellFrame.tsx
          done
          grep -q 'ui-foundation-shell-responsive.css' app/layout.tsx
          if grep -q 'mobile-member-nav.css' app/layout.tsx; then
            echo "Legacy mobile member nav stylesheet is still imported."
            exit 1
          fi
          if grep -q '\[class\*=' app/ui-foundation-shell-responsive.css; then
            echo "Responsive shell CSS must use stable semantic hooks, not generated-class substring selectors."
            exit 1
          fi

          grep -q 'data-ui-foundation-view="dashboard"' app/LeagueApp.tsx
          grep -q 'uiFoundationDashboardPicks' app/LeagueApp.tsx
          grep -q 'uiFoundationDashboardLeague' app/LeagueApp.tsx
          grep -q 'data-ui-foundation-view="pick"' app/LeagueApp.tsx
          grep -q 'uiFoundationPickStatus' app/LeagueApp.tsx
          grep -q 'uiFoundationPickFixture' app/LeagueApp.tsx
          grep -q 'uiFoundationPickActionSelected' app/LeagueApp.tsx
          grep -q 'data-ui-foundation-view="results"' app/LeagueApp.tsx
          grep -q 'uiFoundationResultsSelected' app/LeagueApp.tsx
          grep -q 'uiFoundationResultRow' app/LeagueApp.tsx
          grep -q 'data-ui-foundation-view="history"' app/LeagueApp.tsx
          grep -q 'uiFoundationHistoryTable' app/LeagueApp.tsx
          grep -q 'uiFoundationReigningChampion' app/LeagueApp.tsx
          grep -q 'data-ui-foundation-view="players"' app/LeagueApp.tsx
          grep -q 'uiFoundationPlayerRow' app/LeagueApp.tsx
          grep -q 'data-ui-foundation-view="admin"' app/LeagueApp.tsx
          for hook in uiFoundationAdminTabs uiFoundationAdminPanel uiFoundationAdminUsers uiFoundationAdminUserRow uiFoundationAdminUserField uiFoundationAdminRCount uiFoundationAdminUserActions uiFoundationAdminShareGold; do
            grep -q "$hook" app/LeagueApp.tsx
          done
          if grep -q '\[class\*=' app/ui-foundation-admin.css; then
            echo "Admin UI Foundation CSS must use stable semantic hooks, not generated-class substring selectors."
            exit 1
          fi
          grep -q 'data-ui-foundation-view="table"' app/CanonicalLeagueTable.tsx
          grep -q 'uiFoundationStatCentreTable' app/CanonicalLeagueTable.tsx
          grep -q '<h2>Stat Centre</h2>' app/CanonicalLeagueTable.tsx
          grep -q 'ui-foundation-experience.css' app/layout.tsx
          grep -q 'ui-foundation-league.css' app/layout.tsx
          grep -q 'ui-foundation-admin.css' app/layout.tsx
          for retired in app/MobileSidebarPortrait.tsx app/Release4HistoryPrestige.tsx app/release4-history-champion.css app/release4-admin-users-tidy.css app/mobile-member-nav.css; do
            if [ -e "$retired" ]; then
              echo "Retired UI bridge/override has returned: $retired"
              exit 1
            fi
          done
          if find scripts .github/workflows -maxdepth 1 -type f \( -name 'migrate-ui-foundation-*.mjs' -o -name 'finalise-ui-foundation-*.mjs' -o -name 'ui-foundation-*-migration.yml' -o -name 'ui-foundation-*-finalise.yml' \) | grep -q .; then
            echo "One-shot UI Foundation migration helper/workflow was left in the branch."
            exit 1
          fi
          echo "Authenticated shell, member, league and admin surfaces remain on semantic UI Foundation ownership."

      - name: Require release history update
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REF" == rollback/* ]]; then
            echo "Rollback branch detected; release-history update requirement waived."
            exit 0
          fi
          if git diff --quiet "$BASE_SHA"...HEAD -- scripts/apply-reminder-history.mjs; then
            echo "Release History was not updated."
            echo "Every normal PR to main must update scripts/apply-reminder-history.mjs with the release entry/version metadata."
            exit 1
          fi
          echo "Release History update detected."

      - name: Production build
        run: npm run build

      - name: Ensure build is source-clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Build modified tracked repository files"
            git status --short --untracked-files=no
            exit 1
          fi

      - name: Install Playwright test runner for CI only
        run: npm install --no-save --ignore-scripts @playwright/test@1.55.0

      - name: Install Chromium for hydration smoke test
        run: npx playwright install --with-deps chromium

      - name: Start CI auth mock and production server
        shell: bash
        run: |
          node -e 'const http=require("http");http.createServer((req,res)=>{res.writeHead(401,{"content-type":"application/json"});res.end(JSON.stringify({message:"CI unauthenticated"}));}).listen(54321,"127.0.0.1");' > /tmp/bounce-auth-mock.log 2>&1 &
          echo $! > /tmp/bounce-auth-mock.pid
          npm start > /tmp/bounce-next.log 2>&1 &
          echo $! > /tmp/bounce-next.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bounce-auth-mock.log
          cat /tmp/bounce-next.log
          exit 1

      - name: Browser hydration smoke test
        run: npx playwright test tests/hydration-smoke.spec.js --reporter=line

      - name: UI foundation shell contract
        run: npx playwright test tests/ui-foundation-shell.spec.js --reporter=line

      - name: Upload UI foundation shell screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-foundation-shell-screenshots
          path: artifacts/ui-foundation-shell/*.png
          if-no-files-found: ignore
          retention-days: 7
