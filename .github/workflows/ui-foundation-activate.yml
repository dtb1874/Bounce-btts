name: UI foundation shell activation

on:
  push:
    branches:
      - release/ui-foundation-architecture
    paths:
      - scripts/activate-ui-foundation-shell.mjs
      - .github/workflows/ui-foundation-activate.yml

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/ui-foundation-architecture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply declarative shell migration
        run: node scripts/activate-ui-foundation-shell.mjs
      - name: Commit migrated source
        run: |
          if git diff --quiet -- app/LeagueApp.tsx; then
            echo "No LeagueApp migration change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/LeagueApp.tsx
          git commit -m "Activate declarative LeagueApp shell"
          git push origin HEAD:release/ui-foundation-architecture
