name: Build v1.4.6 release

on:
  push:
    branches:
      - release/v1.4.6

permissions:
  contents: write

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v1.4.6 changes
        run: python release-v1.4.6/apply_release.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build compatibility check
        run: npm run build

      - name: Create upload package
        run: |
          rm -rf release-v1.4.6/package
          mkdir -p release-v1.4.6/package/app release-v1.4.6/package/lib
          cp app/LeagueApp.tsx release-v1.4.6/package/app/LeagueApp.tsx
          cp app/release.module.css release-v1.4.6/package/app/release.module.css
          cp lib/api-football.ts release-v1.4.6/package/lib/api-football.ts
          cp lib/fractional.ts release-v1.4.6/package/lib/fractional.ts
          cp README_BOUNCE_BTTS_v1.4.6.txt release-v1.4.6/package/README_BOUNCE_BTTS_v1.4.6.txt
          cd release-v1.4.6/package
          zip -r ../Bounce-BTTS-v1.4.6.zip .

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: Bounce-BTTS-v1.4.6
          path: release-v1.4.6/Bounce-BTTS-v1.4.6.zip

      - name: Commit verified release source to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/LeagueApp.tsx app/release.module.css lib/api-football.ts lib/fractional.ts README_BOUNCE_BTTS_v1.4.6.txt release-v1.4.6/Bounce-BTTS-v1.4.6.zip
          git commit -m "Build Bounce BTTS v1.4.6" || exit 0
          git push
