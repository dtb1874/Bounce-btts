name: Generate dependency lockfile

on:
  push:
    branches:
      - stabilize/canonical-v1.6-foundation

permissions:
  contents: write

jobs:
  lock:
    if: ${{ !contains(github.event.head_commit.message, '[dependency-lock]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit package lock
        shell: bash
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency lock already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Lock production dependencies [dependency-lock]"
          git push origin HEAD:stabilize/canonical-v1.6-foundation
